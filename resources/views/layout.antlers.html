<!doctype html>
<html lang="{{ $site:short_locale }}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ $title }} — {{ $settings:site_name }}</title>
        {{ if url == '/' }}
        <meta name="description" content="Ramblings of Software Engineering Lead, James Nock." />
        {{ else }}
        <meta name="description" content="{{ $intro | strip_tags | entities }}">
        {{ /if }}

        {{ feedamic }}

        <script type="application/ld+json">
            {
              "@context": "https://schema.org/",
              "@type": "blogPost",
              "name": "{{ $title }}",
              "author": {
                "@type": "Person",
                "name": "James Nock"
              },
              "datePublished": "{{ $date | format('Y-m-d') }}",
              "description": "{{ $intro | strip_tags | entities }}"
            }
        </script>
        {{ vite src="resources/css/styles.css|resources/js/site.js" }}
        <link rel="favicon" href="/favicon.ico" />
        <script src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.min.js" defer></script>
    </head>
    <body class="flex flex-col min-h-screen">
        {{ partial:nav }}
        <main id="main-content" class="flex-1">
            {{ $template_content }}
        </main>
        {{ partial:footer }}
    </body>
</html>
